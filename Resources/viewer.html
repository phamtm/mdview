<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Documents are untrusted. DOMPurify strips scripts, but remote images and
       form targets survive it, so a file could beacon home just by being opened.
       This also means any future sanitiser bypass can't fetch or exfiltrate.
       'unsafe-inline' style is required by Mermaid's generated SVG. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src file: data:; style-src 'self' 'unsafe-inline';
                 script-src 'self' 'unsafe-inline'; font-src file:; connect-src 'none';
                 form-action 'none'; base-uri 'none'">
  <title>MDView</title>
  <link rel="stylesheet" href="hljs-light.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="hljs-dark.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="empty" class="empty">
    <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <rect x="12" y="6" width="40" height="52" rx="6" stroke="currentColor" stroke-width="2.5"/>
      <path d="M21 24h13M21 33h22M21 42h17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <p class="empty-title">No document open</p>
    <p class="empty-hint">Drop a Markdown file here, or press <kbd>⌘</kbd><kbd>O</kbd></p>
  </div>

  <main id="doc" class="prose" hidden></main>

  <div id="findbar" class="findbar" hidden>
    <input id="findinput" type="search" placeholder="Find in document" spellcheck="false" autocomplete="off">
    <button id="findprev" title="Previous (⇧⏎)" aria-label="Previous match">↑</button>
    <button id="findnext" title="Next (⏎)" aria-label="Next match">↓</button>
    <button id="findclose" title="Close (esc)" aria-label="Close">✕</button>
  </div>

  <!-- Built from web/src by web/build.mjs. mermaid.js is injected on demand. -->
  <script src="bundle.js"></script>
</body>
</html>
